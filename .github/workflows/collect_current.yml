# 저장 위치: 프로젝트 루트의 .github/workflows/collect_current.yml
# 현재 연재 중인 작품의 관심 수·연재 시작일을 data/current_webtoons.json에 모읍니다. 끊겨도 다시 실행하면 이어서 합니다.
# 매주 일요일 19:00 UTC(= 월요일 새벽 4시 KST)에 자동으로 한 번 돌고, Actions 화면의 "Run workflow" 버튼으로도 실행할 수 있습니다.
# (매일 도는 daily_scrape가 02:00 KST에 끝난 뒤라 겹치지 않고, 같은 concurrency 그룹이라 겹쳐도 순서대로 돕니다.)

name: Collect Current

on:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "시험용: 이 개수만 조회 (비우면 전부)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scouting-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install requests numpy scipy
      - name: 수집
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="--limit ${{ github.event.inputs.limit }}"; fi
          python collect_current.py $ARGS
      - name: 결과 커밋 및 푸시
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/current_webtoons.json
          if git diff --quiet --cached; then
            echo "올릴 변경이 없습니다."
            exit 0
          fi
          git commit -m "chore: 현재 연재작 관심 수 수집 $(date +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "푸시 실패, 다시 시도 ($i/5)"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
