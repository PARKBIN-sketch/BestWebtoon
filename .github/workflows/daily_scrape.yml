# 저장 위치: 프로젝트 루트의 .github/workflows/daily_scrape.yml
# (GitHub이 이 경로에 있는 .yml 파일만 자동으로 인식합니다)

name: Daily Webtoon Scraping

on:
  schedule:
    # UTC 기준 17:00 = 한국시간(KST) 새벽 2:00
    # 원하는 시간으로 바꾸려면: 한국시간 - 9시간 = UTC 시간
    - cron: "0 17 * * *"
  workflow_dispatch:  # "Run workflow" 버튼으로 수동 실행도 가능하게 함

permissions:
  contents: write  # 자동 커밋/푸시를 위해 쓰기 권한 명시

jobs:
  scrape:
    # ubuntu-latest는 2026-10-19~11-19 사이에 Ubuntu 26.04로 단계적으로 바뀜(GitHub 공지).
    # 새벽에 사람 없이 도는 작업이라, 도구 버전이 바뀌어 깨지는 일이 없도록 24.04로 고정해 둠.
    # 나중에 runs-on을 ubuntu-26.04로 바꿔 Run workflow로 한 번 시험해 보고 옮기면 됨.
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6   # v4는 Node 20 기반이라 경고가 뜸 (v5부터 Node 24)

      - name: Python 설치
        uses: actions/setup-python@v6   # v5는 Node 20 기반이라 경고가 뜸
        with:
          python-version: "3.13"

      - name: 의존성 설치
        run: pip install requests

      - name: 크롤러 실행
        run: python scouting_desk_crawler.py

      - name: 사이트 자동 빌드 (history.json → scouting_desk_mockup.html)
        # 예전엔 이 병합을 사람이 대화창에서 매번 손으로 했음.
        # build_site.py가 REAL_DATA 부분만 갈아끼우고 나머지(디자인/로직)는
        # 그대로 두므로, UI를 바꾼 뒤엔 새 scouting_desk_mockup.html을
        # 저장소에 한 번 다시 올려두면 그다음부턴 계속 이 위에 자동 반영됨.
        run: python build_site.py

      - name: 수집 결과 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ scouting_desk_mockup.html
          git diff --quiet --cached || git commit -m "chore: 자동 수집 및 사이트 반영 $(date +'%Y-%m-%d')"
          git push
